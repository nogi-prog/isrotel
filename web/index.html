<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%92%3C/text%3E%3C/svg%3E"
    />
    <title>ישרוטל</title>
    <script>
      // מבצע את בחירת המצב הכהה/בהיר מוקדם ככל האפשר, לפני הציור הראשון -
      // כדי שלא יהבהב הצבע הלא נכון עד ש-ThemeToggle עולה ורצה.
      (function () {
        try {
          var theme = localStorage.getItem('theme');
          if (theme === 'light' || theme === 'dark') {
            document.documentElement.setAttribute('data-theme', theme);
          }
        } catch (error) {
          // localStorage חסום (למשל דפדפן בפרטיות) - נופל להעדפת המערכת בלבד.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
